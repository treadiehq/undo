name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # The web UI must be built before cargo so `include_dir!` embeds the
      # real app instead of the build.rs placeholder page.
      - name: Build web UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../undo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz undo
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: undo-${{ matrix.target }}
          path: undo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      # Publish a checksum manifest so `undo update` can verify the artifact's
      # integrity before replacing the running binary (#33).
      - name: Generate checksums
        run: sha256sum undo-*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            undo-*.tar.gz
            SHA256SUMS
